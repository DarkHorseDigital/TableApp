<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TableApp</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6750A4">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, Arial, sans-serif; }
        
        body { 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            /* Поддержка высоты экрана на мобильных с учетом панелей навигации */
            height: -webkit-fill-available;
            background-color: #f5f5f5; 
            overflow: hidden; 
        }
        
        html {
            height: -webkit-fill-available;
        }
        
        .header-table {
            display: flex;
            background: #6750A4;
            color: white;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 2px solid #4f3a80;
            flex-shrink: 0;
            /* Учет челки/вырезов сверху на смартфонах */
            padding-top: env(safe-area-inset-top, 0px);
        }

        .table-container { 
            flex: 1; 
            overflow-y: auto; 
            background: white; 
        }
        
        .row { 
            display: flex; 
            border-bottom: 1px solid #e0e0e0; 
            align-items: stretch; 
        }
        
        .cell { 
            padding: 10px 6px; 
            font-size: 12px; 
            word-break: break-word; 
            display: flex;
            align-items: center; 
        }
        
        .col-name { flex: 1; width: 0; border-right: 1px solid #e0e0e0; }
        .col-comment { flex: 1; width: 0; }
        .col-qty { flex-shrink: 0; width: 65px; text-align: center; border-right: 1px solid #e0e0e0; }
        .col-unit { flex-shrink: 0; width: 85px; text-align: center; border-right: 1px solid #e0e0e0; }

        .header-table .cell { border-right: 1px solid #4f3a80; text-align: left; display: block; padding: 10px 6px;}
        .header-table .col-qty, .header-table .col-unit { text-align: center; }

        textarea {
            width: 100%;
            min-height: 28px;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px;
            font-size: 12px;
            outline: none;
            resize: none; 
            overflow: hidden; 
            font-family: inherit;
        }
        textarea:focus { border-color: #6750A4; }

        /* === ПАНЕЛЬ КНОПОК С ЗАЩИТОЙ ОТ НАВИГАЦИИ ТЕЛЕФОНА === */
        .footer { 
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            padding: 16px; 
            background: rgba(245, 245, 245, 0.95); 
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0; 
            position: relative;
            z-index: 100;
            /* Безопасный отступ снизу для жестовых полос и навигационных баров Android/iOS */
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px) + 12px); 
        }

        /* Общие стили круглых FAB-кнопок */
        .fab-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, background-color 0.2s;
        }
        .fab-btn:active { transform: scale(0.92); }

        /* Кнопка сохранения (Фиолетовая) */
        .save-btn { background: #6750A4; }
        .save-btn:active { background: #533f8a; }

        /* Кнопка очистки (Красная) */
        .clear-btn { background: #BA1A1A; }
        .clear-btn:active { background: #93000A; }

        .fab-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
    </style>
</head>
<body>

    <div class="header-table">
        <div class="cell col-name">Наименование</div>
        <div class="cell col-qty">Кол-во</div>
        <div class="cell col-unit">Ед. изм.</div>
        <div class="cell col-comment">Комментарий</div>
    </div>

    <div class="table-container" id="table-body"></div>

    <!-- Обновленный подвал с круглыми кнопками и отступами -->
    <div class="footer">
        <!-- Кнопка Очистить (Красная) -->
        <button class="fab-btn clear-btn" onclick="clearAllFields()" title="Очистить всё">
            <svg viewBox="0 0 24 24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
        <!-- Кнопка Сохранить (Фиолетовая с дискетой) -->
        <button class="fab-btn save-btn" onclick="saveToPng()" title="Сохранить в PNG">
            <svg viewBox="0 0 24 24">
                <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
            </svg>
        </button>
    </div>

    <script>
        const defaultProducts = [
            {name: "Лаваш", unit: "Лист"}, {name: "Помидоры", unit: "Шт."}, {name: "Сыр Пармезан", unit: "Банка"},
            {name: "Курица Кимчи П/Ф", unit: "Шт."}, {name: "Салат \"Классическая\"", unit: "Шт."}, {name: "Салат \"Вкусочная\"", unit: "Шт."},
            {name: "Соус \"Сливочно-устричный\"", unit: "Банка"}, {name: "Соус \"Лютый томат\"", unit: "Банка"}, {name: "Соус \"Кимчи-майо\"", unit: "Банка"},
            {name: "Соус острый Шрирача", unit: "Шт."}, {name: "Кока-кола", unit: "Шт."}, {name: "Кока-кола без сахара", unit: "Шт."},
            {name: "Вода без газа", unit: "Шт."}, {name: "Вода с газом", unit: "Шт."}, {name: "Вода для кулера", unit: "Бутыль"},
            {name: "Кофе зерновой", unit: "Шт."}, {name: "Шоколад для кофе-машины", unit: "Шт."}, {name: "Молоко сухое", unit: "Шт."},
            {name: "Чай черный", unit: "Шт."}, {name: "Чай зеленый", unit: "Шт."}, {name: "Сахар порционный", unit: "Шт."},
            {name: "Пакет для шаурмы", unit: "Шт."}, {name: "Пакет \"майка\"", unit: "Шт."}, {name: "Пакет для мусора", unit: "Шт."},
            {name: "Контейнер для сувлаки", unit: "Шт."}, {name: "Контейнер для боулов", unit: "Шт."}, {name: "Крышка контейнера для боулов", unit: "Шт."},
            {name: "Стакан для кофе", unit: "Шт."}, {name: "Крышка стакана для кофе", unit: "Шт."}, {name: "Фольга", unit: "Рулон"},
            {name: "Салфетки гостевые", unit: "Упаковка"}, {name: "Салфетки влажные", unit: "Шт."}, {name: "Вилки одноразовые", unit: "Шт."},
            {name: "Трубочки одноразовые", unit: "Шт."}, {name: "Зубочистки", unit: "Шт."}, {name: "Размешиватели для кофе", unit: "Шт."},
            {name: "Лента чековая", unit: "Рулон"}, {name: "Полотенца бумажные", unit: "Упаковка"}, {name: "Перчатки M", unit: "Упаковка"},
            {name: "Перчатки L", unit: "Упаковка"}, {name: "Средство для стекол", unit: "Шт."}, {name: "НУК 0,02%", unit: "Литр"},
            {name: "Спирт 70%", unit: "Литр"}
        ].map(p => ({...p, quantity: '', comment: ''}));

        // ЗАГРУЗКА ДАННЫХ ИЗ LOCALSTORAGE ИЛИ ДЕФОЛТНЫХ
        let products = JSON.parse(localStorage.getItem('tableapp_data')) || defaultProducts;

        function autoResize(textarea, index, type) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
            
            if (type === 'qty') products[index].quantity = textarea.value;
            if (type === 'com') products[index].comment = textarea.value;

            // АВТОСОХРАНЕНИЕ В ПАМЯТЬ ТЕЛЕФОНА С ПРИ ИЗМЕНЕНИИ
            localStorage.setItem('tableapp_data', JSON.stringify(products));
        }

        // Рендеринг таблицы с учетом загруженных данных
        const container = document.getElementById('table-body');
        products.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `
                <div class="cell col-name">${item.name}</div>
                <div class="cell col-qty">
                    <textarea id="qty-${index}" rows="1" oninput="autoResize(this, ${index}, 'qty')">${item.quantity || ''}</textarea>
                </div>
                <div class="cell col-unit">${item.unit}</div>
                <div class="cell col-comment">
                    <textarea id="com-${index}" rows="1" oninput="autoResize(this, ${index}, 'com')">${item.comment || ''}</textarea>
                </div>
            `;
            container.appendChild(row);

            // Адаптируем высоту полей ввода под загруженный текст сразу после вставки в DOM
            setTimeout(() => {
                const qtyTextarea = document.getElementById(`qty-${index}`);
                const comTextarea = document.getElementById(`com-${index}`);
                if(qtyTextarea) autoResize(qtyTextarea, index, 'qty');
                if(comTextarea) autoResize(comTextarea, index, 'com');
            }, 50);
        });

        // Функция очистки всех полей таблицы
        function clearAllFields() {
            if (confirm("Вы уверены, что хотите очистить всю таблицу?")) {
                products = defaultProducts.map(p => ({...p, quantity: '', comment: ''}));
                localStorage.removeItem('tableapp_data');
                
                                // Сбрасываем значения элементов интерфейса визуально
                products.forEach((item, index) => {
                    const qtyField = document.getElementById(`qty-${index}`);
                    const comField = document.getElementById(`com-${index}`);
                    if (qtyField) { qtyField.value = ''; qtyField.style.height = '28px'; }
                    if (comField) { comField.value = ''; comField.style.height = '28px'; }
                });
            }
        }

        // Функция точной отрисовки PNG на Canvas (остается строго однострочной)
        function saveToPng() {
            const width = 1000;
            const rowHeight = 80;
            const headerHeight = 90;
            const totalHeight = headerHeight + (products.length * rowHeight);

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = totalHeight;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, totalHeight);

            ctx.fillStyle = '#000000';
            const col1 = 0, col2 = width * 0.4, col3 = width * 0.6, col4 = width * 0.8;

            ctx.font = 'bold 26px Roboto, Arial, sans-serif';
            ctx.fillText("Наименование", col1 + 15, 55);
            ctx.fillText("Кол-во", col2 + 15, 55);
            ctx.fillText("Ед. изм.", col3 + 15, 55);
            ctx.fillText("Комментарий", col4 + 15, 55);

            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000000';
            ctx.beginPath();
            ctx.moveTo(0, headerHeight); ctx.lineTo(width, headerHeight);
            ctx.stroke();

            ctx.font = '26px Roboto, Arial, sans-serif';
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#D3D3D3';

            products.forEach((item, i) => {
                const yPos = headerHeight + (i * rowHeight);
                const textY = yPos + 50;

                const cleanQty = (item.quantity || '').replace(/\s+/g, ' ');
                const cleanComment = (item.comment || '').replace(/\s+/g, ' ');

                ctx.fillText(item.name, col1 + 15, textY);
                ctx.fillText(cleanQty, col2 + 15, textY);
                ctx.fillText(item.unit, col3 + 15, textY);
                ctx.fillText(cleanComment, col4 + 15, textY);

                ctx.beginPath();
                ctx.moveTo(0, yPos + rowHeight); ctx.lineTo(width, yPos + rowHeight);
                ctx.stroke();
            });

            ctx.beginPath();
            ctx.moveTo(col2, 0); ctx.lineTo(col2, totalHeight);
            ctx.moveTo(col3, 0); ctx.lineTo(col3, totalHeight);
            ctx.moveTo(col4, 0); ctx.lineTo(col4, totalHeight);
            ctx.stroke();

            const link = document.createElement('a');
            link.download = `Table_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Регистрация Service Worker для PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker зарегистрирован'))
                .catch(err => console.error('Ошибка SW:', err));
        }
    </script>
</body>
</html>
