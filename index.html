<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TableApp</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6750A4">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, Arial, sans-serif; }
        
        body { 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            height: -webkit-fill-available;
            background-color: #f5f5f5; 
            overflow: hidden; 
        }
        
        html {
            height: -webkit-fill-available;
        }
        
        .header-table {
            display: flex;
            background: #6750A4;
            color: white;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 2px solid #4f3a80;
            flex-shrink: 0;
            padding-top: env(safe-area-inset-top, 0px);
        }
        
        .table-container { 
            flex: 1; 
            overflow-y: auto; 
            background: white; 
            padding-bottom: 90px; 
        }

        .row { 
            display: flex; 
            border-bottom: 1px solid #e0e0e0; 
            align-items: stretch; 
        }
        
        .cell { 
            padding: 10px 6px; 
            font-size: 12px; 
            word-break: break-word; 
            display: flex;
            align-items: center; 
        }
        
        .col-name { flex: 1; width: 0; border-right: 1px solid #e0e0e0; }
        .col-qty { flex-shrink: 0; width: 75px; text-align: center; border-right: 1px solid #e0e0e0; }
        .col-unit { flex-shrink: 0; width: 95px; text-align: center; }

        .header-table .cell { border-right: 1px solid #4f3a80; text-align: left; display: block; padding: 10px 6px;}
        .header-table .col-unit { border-right: none; }
        .header-table .col-qty, .header-table .col-unit { text-align: center; }

        textarea {
            width: 100%;
            min-height: 28px;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px;
            font-size: 12px;
            outline: none;
            resize: none; 
            overflow: hidden; 
            font-family: inherit;
        }
        textarea:focus { border-color: #6750A4; }
        
        .footer { 
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            padding: 16px; 
            background: transparent; 
            border-top: none;       
            flex-shrink: 0; 
            position: absolute;      
            bottom: 0;
            right: 0;
            z-index: 100;
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); 
            pointer-events: none;    
        }

        .fab-btn {
            pointer-events: auto;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, background-color 0.2s;
        }

        .fab-btn:active { transform: scale(0.92); }
        .save-btn { background: #6750A4; }
        .save-btn:active { background: #533f8a; }
        .clear-btn { background: #BA1A1A; }
        .clear-btn:active { background: #93000A; }

        .fab-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
    </style>
</head>
<body>

    <div class="header-table">
        <div class="cell col-name">Наименование</div>
        <div class="cell col-qty">Кол-во</div>
        <div class="cell col-unit">Ед. изм.</div>
    </div>

    <div class="table-container" id="table-body"></div>

    <div class="footer">
        <button class="fab-btn clear-btn" onclick="clearAllFields()" title="Очистить всё">
            <svg viewBox="0 0 24 24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
        <button class="fab-btn save-btn" onclick="saveToPng()" title="Сохранить в PNG">
            <svg viewBox="0 0 24 24">
                <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
            </svg>
        </button>
    </div>

    <script>
        // Исходный список товаров (меняйте пункты здесь для проверки тестов!)
        const defaultProducts = [
            {name: "Помидоры", unit: "Шт."},
            {name: "Сыр Пармезан", unit: "Порция"},
            {name: "Курица Кимчи П/Ф", unit: "Шт."},
            {name: "Салат \"Классический\"", unit: "Шт."},
            {name: "Салат \"Вкусочный\"", unit: "Шт."},
            {name: "Соус \"Сливочно-устричный\"", unit: "Пакет"},
            {name: "Соус \"Лютый томат\"", unit: "Пакет"},
            {name: "Соус \"Кимчи-майо\"", unit: "Пакет"},
            {name: "Соус острый Шрирача", unit: "Шт."},
            {name: "Кока-кола", unit: "Шт."},
            {name: "Кока-кола без сахара", unit: "Шт."},
            {name: "Вода без газа", unit: "Шт."},
            {name: "Вода с газом", unit: "Шт."},
            {name: "Сок томатный", unit: "Шт."},
            {name: "Сок яблочный", unit: "Шт."},
            {name: "Вода для кулера", unit: "Бутыль"},
            {name: "Кофе зерновой", unit: "Упак."},
            {name: "Шоколад для кофе-машины", unit: "Упак."},
            {name: "Молоко сухое", unit: "Упак."},
            {name: "Чай черный", unit: "Коробка"},
            {name: "Чай зеленый", unit: "Коробка"},
            {name: "Сахар порционный", unit: "Коробка"},
            {name: "Пакет для шаурмы", unit: "Шт."},
            {name: "Пакет \"майка\"", unit: "Упак."},
            {name: "Пакет для мусора", unit: "Рулон"},
            {name: "Контейнер для сувлаки", unit: "Упак."},
            {name: "Крышка контейнера для сувлаки", unit: "Упак."},
            {name: "Контейнер для боулов", unit: "Упак."}, 
            {name: "Крышка контейнера для боулов", unit: "Упак."},
            {name: "Стакан для кофе", unit: "Упак."},
            {name: "Крышка стакана для кофе", unit: "Упак."},
            {name: "Фольга", unit: "Рулон"},
            {name: "Салфетки гостевые", unit: "Упаковка"},
            {name: "Салфетки влажные", unit: "Шт."},
            {name: "Вилки одноразовые", unit: "Шт."},
            {name: "Трубочки одноразовые", unit: "Шт."},
            {name: "Зубочистки", unit: "Упак."},
            {name: "Размешиватели для кофе", unit: "Шт."},
            {name: "Лента чековая", unit: "Рулон"},
            {name: "Полотенца бумажные", unit: "Упаковка"},
            {name: "Перчатки L", unit: "Упаковка"}, 
            {name: "Средство для стекол", unit: "Шт."},
            {name: "Спирт 70%", unit: "Литр"}
        ].map(p => ({...p, quantity: ''}));

        // СИНХРОНИЗАЦИЯ С LOCALSTORAGE: подтягиваем введенные цифры, но структуру берем новую
        let savedData = JSON.parse(localStorage.getItem('tableapp_data')) || [];
        let products = defaultProducts.map(defaultItem => {
            const savedItem = savedData.find(s => s.name === defaultItem.name);
            return {
                ...defaultItem,
                quantity: savedItem ? savedItem.quantity : ''
            };
        });
        localStorage.setItem('tableapp_data', JSON.stringify(products));

        function autoResize(textarea, index, type) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
            
            if (type === 'qty') products[index].quantity = textarea.value;
            localStorage.setItem('tableapp_data', JSON.stringify(products));
        }

        // Рендеринг таблицы на экран
        const container = document.getElementById('table-body');
        products.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `
                <div class="cell col-name">${item.name}</div>
                <div class="cell col-qty">
                    <textarea id="qty-${index}" rows="1" oninput="autoResize(this, ${index}, 'qty')">${item.quantity || ''}</textarea>
                </div>
                <div class="cell col-unit">${item.unit}</div>
            `;
            container.appendChild(row);

            setTimeout(() => {
                const qtyTextarea = document.getElementById(`qty-${index}`);
                if(qtyTextarea) autoResize(qtyTextarea, index, 'qty');
            }, 50);
        });

        function clearAllFields() {
            if (confirm("Вы уверены, что хотите очистить всю таблицу?")) {
                products = defaultProducts.map(p => ({...p, quantity: ''}));
                localStorage.removeItem('tableapp_data');
                
                products.forEach((item, index) => {
                    const qtyField = document.getElementById(`qty-${index}`);
                    if (qtyField) { qtyField.value = ''; qtyField.style.height = '28px'; }
                });
            }
        }

         function saveToPng() {
    const totalWidth = 719; // Жестко фиксируем общую ширину картинки
    const defaultRowHeight = 80; // Базовая высота строки для однострочного текста
    const headerHeight = 90;
    const paddingX = 20; // Отступ слева и справа в ячейках
    const fontHeader = 'bold 26px Roboto, Arial, sans-serif';
    const fontBody = '26px Roboto, Arial, sans-serif';
    const lineHeight = 34; // Расстояние между строками при переносе текста

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    // Функция для разбиения текста на строки под жестко заданную ширину
    function splitTextIntoLines(text, maxWidth, context) {
        const words = text.split(' ');
        const lines = [];
        let currentLine = words[0] || '';

        for (let i = 1; i < words.length; i++) {
            const word = words[i];
            context.font = fontBody;
            const width = context.measureText(currentLine + " " + word).width;
            if (width < maxWidth) {
                currentLine += " " + word;
            } else {
                lines.push(currentLine);
                currentLine = word;
            }
        }
        if (currentLine) lines.push(currentLine);
        return lines;
    }

    // --- Шаг 1: Сначала замерим, сколько места нужно под "Кол-во" и "Ед. изм." ---
    let maxCol2TextWidth = 0;
    let maxCol3TextWidth = 0;

    // Замеряем заголовки второго и третьего столбца
    ctx.font = fontHeader;
    maxCol2TextWidth = Math.max(maxCol2TextWidth, ctx.measureText("Кол-во").width);
    maxCol3TextWidth = Math.max(maxCol3TextWidth, ctx.measureText("Ед. изм.").width);

    // Замеряем введенные данные для второго и третьего столбца
    ctx.font = fontBody;
    products.forEach(item => {
        const cleanQty = (item.quantity || '').replace(/\s+/g, ' ');
        maxCol2TextWidth = Math.max(maxCol2TextWidth, ctx.measureText(cleanQty).width);
        maxCol3TextWidth = Math.max(maxCol3TextWidth, ctx.measureText(item.unit).width);
    });

    // Вычисляем финальную ширину 2-й и 3-й колонки с учетом отступов
    const widthCol2 = Math.ceil(maxCol2TextWidth + paddingX * 2);
    const widthCol3 = Math.ceil(maxCol3TextWidth + paddingX * 2);
    
    // Первая колонка забирает ВСЁ оставшееся от 719px место
    const widthCol1 = totalWidth - widthCol2 - widthCol3;

    // Допустимая ширина чистого текста внутри первой колонки с учетом боковых отступов
    const maxTextWidthCol1 = widthCol1 - (paddingX * 2); 

    // Рассчитываем координаты начала колонок
    const col1 = 0;
    const col2 = widthCol1;
    const col3 = widthCol1 + widthCol2;

    // --- Шаг 2: Расчет переносов для Названий и высоты строк ---
    const preparedRows = products.map(item => {
        const cleanQty = (item.quantity || '').replace(/\s+/g, ' ');
        
        // Разбиваем текст названия под оставшуюся ширину первой колонки
        const nameLines = splitTextIntoLines(item.name, maxTextWidthCol1, ctx);
        
        // Высчитываем высоту строки в зависимости от количества строк в названии
        const rowHeight = nameLines.length > 1 
            ? Math.max(defaultRowHeight, nameLines.length * lineHeight + 35) 
            : defaultRowHeight;

        return {
            nameLines: nameLines,
            qty: cleanQty,
            unit: item.unit,
            height: rowHeight
        };
    });

    // Считаем итоговую высоту картинки
    const totalRowsHeight = preparedRows.reduce((sum, row) => sum + row.height, 0);
    const totalHeight = headerHeight + totalRowsHeight;

    // Задаем финальные размеры Canvas
    canvas.width = totalWidth;
    canvas.height = totalHeight;

    // Белый фон
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, totalWidth, totalHeight);

    // Шапка таблицы
    ctx.fillStyle = '#000000';
    ctx.font = fontHeader;
    ctx.fillText("Наименование", col1 + paddingX, 55);
    ctx.fillText("Кол-во", col2 + paddingX, 55);
    ctx.fillText("Ед. изм.", col3 + paddingX, 55);

    // Жирная линия под шапкой
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#000000';
    ctx.beginPath();
    ctx.moveTo(0, headerHeight); 
    ctx.lineTo(totalWidth, headerHeight);
    ctx.stroke();

    // Отрисовка строк
    let currentY = headerHeight;

    preparedRows.forEach((row) => {
        ctx.font = fontBody;
        ctx.strokeStyle = '#D3D3D3'; // Тонкие серые линии для строк

        // Рендерим каждую строчку названия товара (многострочный вывод)
        row.nameLines.forEach((line, index) => {
            const startTextY = currentY + (row.height - (row.nameLines.length - 1) * lineHeight) / 2 + 8;
            ctx.fillText(line, col1 + paddingX, startTextY + (index * lineHeight));
        });

        // Центрируем текст для количества и единиц измерения по вертикали всей строки
        const centerTextY = currentY + (row.height / 2) + 9;
        ctx.fillText(row.qty, col2 + paddingX, centerTextY);
        ctx.fillText(row.unit, col3 + paddingX, centerTextY);

        currentY += row.height;

        // Горизонтальная черта под строкой
        ctx.beginPath();
        ctx.moveTo(0, currentY); 
        ctx.lineTo(totalWidth, currentY);
        ctx.stroke();
    });

    // Вертикальные разделительные линии колонок на всю высоту
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(col2, 0); ctx.lineTo(col2, totalHeight);
    ctx.moveTo(col3, 0); ctx.lineTo(col3, totalHeight);
    ctx.stroke();

    // Скачивание файла
    const link = document.createElement('a');
    link.download = `Table_${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
}



        // РЕГИСТРАЦИЯ SW С ХАКОМ ПРОТИВ КЭША GITHUB PAGES
        if ('serviceWorker' in navigator) {
            const cacheBuster = Math.floor(Date.now() / 120000); // меняется каждые 2 минуты
            
            navigator.serviceWorker.register(`sw.js?v=${cacheBuster}`)
                .then((reg) => {
                    console.log('Service Worker зарегистрирован');
                    reg.update();

                    if (reg.waiting) {
                        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }

                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                newWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(err => console.error('Ошибка SW:', err));

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
